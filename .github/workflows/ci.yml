name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run formula unit tests
        run: npm test

      - name: Verify datasets, formulas, and SEO limits
        run: npm run data:check

      - name: Build static site
        run: npm run build

      - name: Audit internal links and orphan pages
        run: npm run orphan:check
